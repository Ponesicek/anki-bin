name: Update from upstream

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update.yml
  schedule:
    - cron: "53 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-from-upstream
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 180

    steps:
      - name: Install packaging tools
        run: dnf install -y copr-cli curl git jq rpm-build

      - name: Check out packaging repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check latest stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release=$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ankitects/anki/releases/latest)
          version=$(jq --raw-output '.tag_name' <<< "$release")

          if [[ ! $version =~ ^[0-9]+\.[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Unexpected release tag: $version" >&2
            exit 1
          fi

          for arch in x86_64 aarch64; do
            asset="anki-$version-linux-$arch.tar.zst"
            if ! jq --exit-status --arg asset "$asset" \
              '.assets[] | select(.name == $asset)' <<< "$release" >/dev/null; then
              echo "Release $version does not contain $asset" >&2
              exit 1
            fi
          done

          current=$(awk '$1 == "Version:" { print $2; exit }' anki-bin.spec)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ $version == "$current" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [[ $GITHUB_EVENT_NAME == push || $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "Rebuilding current release: $version"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "Already packaged: $version"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "New stable release: $current -> $version"
          fi

      - name: Update spec version
        if: steps.release.outputs.changed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          sed -i -E "s/^Version:[[:space:]]+.*/Version:        $VERSION/" anki-bin.spec
          release_date=$(LC_ALL=C date '+%a %b %d %Y')
          sed -i "/^%changelog/a * $release_date Ponesicek <ponesicek@users.noreply.github.com> - $VERSION-1\\
          - Package upstream Anki $VERSION binary release" anki-bin.spec

      - name: Build and submit architecture packages
        if: steps.release.outputs.build == 'true'
        shell: bash
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z $COPR_CONFIG ]]; then
            echo "The COPR_CONFIG repository secret is not configured" >&2
            exit 1
          fi

          install -d -m 0700 ~/.config
          printf '%s' "$COPR_CONFIG" > ~/.config/copr
          chmod 0600 ~/.config/copr

          for arch in x86_64 aarch64; do
            topdir="$RUNNER_TEMP/rpmbuild-$arch"
            mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

            curl --fail --show-error --location --retry 3 \
              --output "$topdir/SOURCES/anki-$VERSION-linux-$arch.tar.zst" \
              "https://github.com/ankitects/anki/releases/download/$VERSION/anki-$VERSION-linux-$arch.tar.zst"

            rpmbuild -bs --target "$arch" \
              --define "_topdir $topdir" \
              anki-bin.spec

            srpm=$(find "$topdir/SRPMS" -maxdepth 1 -name '*.src.rpm' -print -quit)
            test -n "$srpm"
            copr build ponesicek/anki-bin \
              --chroot "fedora-44-$arch" \
              "$srpm"
          done

      - name: Commit packaged version
        if: steps.release.outputs.changed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anki-bin.spec
          git commit -m "chore: package Anki $VERSION"
          git push
